<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine Zorea</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      font-family: 'Times New Roman', Times, serif;
      background: #f4f4f4;
      color: #000;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }

    /* --- STICKY NAVIGATION --- */

    .nav-title {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
      z-index: 100;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .nav-bottom-left {
      position: fixed;
      bottom: 24px;
      left: 24px;
      font-size: 1rem;
      z-index: 100;
      line-height: 1.35;
    }

    .nav-bottom-right {
      position: fixed;
      bottom: 24px;
      right: 24px;
      font-size: 1rem;
      z-index: 100;
      line-height: 1.35;
      text-align: right;
    }

    /* --- HERO: full viewport, sphere centred --- */

    .hero-section {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sphere-container {
      position: relative;
      width: 60vh;
      height: 60vh;
      max-width: 90vw;
      flex-shrink: 0;
    }

    .sphere-container canvas {
      display: block;
      touch-action: pan-y;
    }

    /* --- BIO SECTION: below the fold, fade-in on scroll --- */

    .bio-section {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 80px 20px 160px;
    }

    .bio-text {
      width: 70%;
      max-width: 70vw;
      text-align: center;
      font-size: 1.8rem;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease, transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bio-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- RESPONSIVE --- */

    @media (max-width: 600px) {
      .bio-text {
        font-size: 1.3rem;
        width: 90%;
        max-width: 90vw;
      }
      .sphere-container {
        width: 80vw;
        height: 80vw;
        max-height: 55vh;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky navigation -->
  <a href="#" class="nav-title" onclick="window.scrollTo({top:0,behavior:'smooth'}); return false;">Marine Zorea</a>
  <a href="#" class="nav-bottom-left">Works and<br>Publications</a>
  <a href="#" class="nav-bottom-right">About and<br>Contact</a>

  <!-- First viewport: 3D sphere -->
  <div class="hero-section">
    <div class="sphere-container" id="sphere"></div>
  </div>

  <!-- Below the fold: bio -->
  <div class="bio-section">
    <p class="bio-text" id="bio">
      Marine Zorea is a designer and researcher exploring the emergent and critical realities of everyday technology through objects, sounds, images, and scholarly writing.
    </p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (function () {
    /* ===========================================
       CONFIG
       =========================================== */
    var SPHERE_R   = 150;         /* 3-D sphere radius */
    var CAM_Z      = 330;         /* camera distance (lower = bigger sphere) */
    var AUTO_SPEED = 0.0004;      /* horizontal spin   */
    var ANG_SCALE  = 0.005;       /* px → radians for patch size */
    var SEGS       = 14;          /* subdivisions per patch edge */
    var BATCH_SIZE = 5;           /* images per fade-in wave */
    var BATCH_GAP  = 0.6;         /* seconds between waves */
    var FADE_DUR   = 0.8;         /* seconds per fade */

    /* ===========================================
       IMAGE DATA — 20 entries
       =========================================== */
    var imageData = [
      { src: 'https://marinezo.com/img/project_livingsounds/4.JPG',              ratio: 'square', w: 65 },
      { src: 'https://marinezo.com/img/home/thumb_audible.gif',                  ratio: 'wide',   w: 55 },
      { src: 'https://marinezo.com/img/project_allisheard/1.png',                ratio: 'square', w: 50 },
      { src: 'https://marinezo.com/img/project_anatomo/4.gif',                   ratio: 'wide',   w: 70 },
      { src: 'https://marinezo.com/img/project_chanelspaces/3.jpg',              ratio: 'square', w: 45 },
      { src: 'https://marinezo.com/img/home/thumb_CHANEL3.png',                  ratio: 'wide',   w: 60 },
      { src: 'https://marinezo.com/img/project_speakingofcollectivedining/1.gif',ratio: 'square', w: 55 },
      { src: 'https://marinezo.com/img/project_wavesbeyond/7.jpeg',              ratio: 'wide',   w: 65 },
      { src: 'https://marinezo.com/img/project_formsofquery/1.png',              ratio: 'square', w: 75 },
      { src: 'https://marinezo.com/img/project_thoughtfulobject/6.gif',          ratio: 'wide',   w: 50 },
      { src: 'https://marinezo.com/img/project_wavesbeyond/1.jpg',              ratio: 'square', w: 60 },
      { src: 'https://marinezo.com/img/project_livingsounds/4.JPG',              ratio: 'wide',   w: 48 },
      { src: 'https://marinezo.com/img/home/thumb_audible.gif',                  ratio: 'square', w: 55 },
      { src: 'https://marinezo.com/img/project_allisheard/1.png',                ratio: 'wide',   w: 65 },
      { src: 'https://marinezo.com/img/project_anatomo/4.gif',                   ratio: 'square', w: 45 },
      { src: 'https://marinezo.com/img/project_chanelspaces/3.jpg',              ratio: 'wide',   w: 70 },
      { src: 'https://marinezo.com/img/home/thumb_CHANEL3.png',                  ratio: 'square', w: 50 },
      { src: 'https://marinezo.com/img/project_speakingofcollectivedining/1.gif',ratio: 'wide',   w: 58 },
      { src: 'https://marinezo.com/img/project_wavesbeyond/7.jpeg',              ratio: 'square', w: 48 },
      { src: 'https://marinezo.com/img/project_formsofquery/1.png',              ratio: 'wide',   w: 55 }
    ];

    /* ===========================================
       THREE.JS SETUP
       =========================================== */
    var container = document.getElementById('sphere');
    var cW = container.clientWidth;
    var cH = container.clientHeight;

    var scene    = new THREE.Scene();
    var camera   = new THREE.PerspectiveCamera(50, cW / cH, 1, 2000);
    camera.position.z = CAM_Z;

    var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(cW, cH);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    var group = new THREE.Group();
    scene.add(group);

    /* ===========================================
       CURVED SPHERE-PATCH GEOMETRY
       Each image is mapped onto a section of
       actual sphere surface — the pixels curve.
       =========================================== */
    function createSpherePatch(R, cTheta, cPhi, angW, angH, wSegs, hSegs) {
      var verts   = [];
      var uvs     = [];
      var indices = [];

      /* Centre of this patch in world space */
      var cx = R * Math.sin(cTheta) * Math.cos(cPhi);
      var cy = R * Math.cos(cTheta);
      var cz = R * Math.sin(cTheta) * Math.sin(cPhi);

      for (var iy = 0; iy <= hSegs; iy++) {
        for (var ix = 0; ix <= wSegs; ix++) {
          var u = ix / wSegs;
          var v = iy / hSegs;

          var t = cTheta + (v - 0.5) * angH;
          var p = cPhi   + (u - 0.5) * angW;

          /* Vertex on sphere surface, offset so mesh origin = patch centre */
          verts.push(
            R * Math.sin(t) * Math.cos(p) - cx,
            R * Math.cos(t) - cy,
            R * Math.sin(t) * Math.sin(p) - cz
          );
          uvs.push(u, 1 - v);
        }
      }

      for (var iy2 = 0; iy2 < hSegs; iy2++) {
        for (var ix2 = 0; ix2 < wSegs; ix2++) {
          var a = iy2 * (wSegs + 1) + ix2;
          var b = a + 1;
          var c = a + (wSegs + 1);
          var d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }

      var g = new THREE.BufferGeometry();
      g.setIndex(indices);
      g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      g.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs,   2));
      g.computeVertexNormals();

      return { geometry: g, center: { x: cx, y: cy, z: cz } };
    }

    /* ===========================================
       BUILD PATCHES  (start invisible, fade in by batch)
       =========================================== */
    var loader = new THREE.TextureLoader();
    loader.setCrossOrigin('anonymous');

    var golden  = (1 + Math.sqrt(5)) / 2;
    var meshes  = [];
    var loaded  = [];           /* true once texture arrives */
    var startT  = performance.now() / 1000;

    for (var i = 0; i < imageData.length; i++) {
      var theta = Math.acos(1 - 2 * (i + 0.5) / imageData.length);
      var phi   = 2 * Math.PI * i / golden;
      var data  = imageData[i];

      var angW = data.w * ANG_SCALE;
      var angH = data.ratio === 'square' ? angW : angW * 3 / 5;

      var result = createSpherePatch(SPHERE_R, theta, phi, angW, angH, SEGS, SEGS);

      loaded.push(false);
      (function (idx) {
        var texture = loader.load(data.src, function () { loaded[idx] = true; });
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        var mat = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 0,                 /* start invisible */
          side: THREE.DoubleSide,
          depthWrite: true
        });

        var mesh = new THREE.Mesh(result.geometry, mat);
        mesh.position.set(result.center.x, result.center.y, result.center.z);

        group.add(mesh);
        meshes.push(mesh);
      })(i);
    }

    /* ===========================================
       HOVER — raycasting
       =========================================== */
    var raycaster   = new THREE.Raycaster();
    var mouseVec    = new THREE.Vector2(-999, -999);
    var hoveredMesh = null;

    renderer.domElement.addEventListener('mousemove', function (e) {
      var rect = renderer.domElement.getBoundingClientRect();
      mouseVec.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
      mouseVec.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
    });

    renderer.domElement.addEventListener('mouseleave', function () {
      mouseVec.set(-999, -999);
    });

    /* ===========================================
       ANIMATION
       =========================================== */
    function animate() {
      requestAnimationFrame(animate);
      var now = performance.now() / 1000;
      var elapsed = now - startT;

      /* --- Diagonal drift ---
         Overlapping sine waves at incommensurate frequencies
         produce a pseudo-random path that alternates between
         drifting up-right and down-right. */
      group.rotation.y += AUTO_SPEED;
      group.rotation.x =
        Math.sin(group.rotation.y * 0.37) * 0.14 +
        Math.sin(group.rotation.y * 0.71) * 0.08;
      group.rotation.z =
        Math.sin(group.rotation.y * 0.23) * 0.06;

      /* --- Batched fade-in ---
         Each batch waits for its delay AND for its textures
         to be loaded before fading in. */
      for (var fi = 0; fi < meshes.length; fi++) {
        var mat = meshes[fi].material;
        if (mat.opacity >= 1) continue;

        var batch      = Math.floor(fi / BATCH_SIZE);
        var batchStart = 0.3 + batch * BATCH_GAP;

        if (loaded[fi] && elapsed > batchStart) {
          var progress = Math.min(1, (elapsed - batchStart) / FADE_DUR);
          mat.opacity  = progress;
        }
      }

      /* --- Hover detection --- */
      raycaster.setFromCamera(mouseVec, camera);
      var hits = raycaster.intersectObjects(group.children);

      if (hoveredMesh) {
        hoveredMesh.scale.set(1, 1, 1);
        hoveredMesh = null;
        renderer.domElement.style.cursor = 'default';
      }
      if (hits.length > 0) {
        hoveredMesh = hits[0].object;
        hoveredMesh.scale.set(1.15, 1.15, 1.15);
        renderer.domElement.style.cursor = 'pointer';
      }

      renderer.render(scene, camera);
    }

    animate();

    /* ===========================================
       RESIZE
       =========================================== */
    window.addEventListener('resize', function () {
      cW = container.clientWidth;
      cH = container.clientHeight;
      camera.aspect = cW / cH;
      camera.updateProjectionMatrix();
      renderer.setSize(cW, cH);
    });

    /* ===========================================
       BIO SCROLL-REVEAL
       =========================================== */
    var bio = document.getElementById('bio');
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) bio.classList.add('visible');
      });
    }, { threshold: 0.15 });
    observer.observe(bio);

  })();
  </script>

</body>
</html>
