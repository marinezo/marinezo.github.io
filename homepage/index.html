<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine Zorea</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      font-family: 'Times New Roman', Times, serif;
      background: #f4f4f4;
      color: #000;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }

    /* --- STICKY NAVIGATION --- */

    .nav-title {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
      z-index: 100;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .nav-bottom-left {
      position: fixed;
      bottom: 24px;
      left: 24px;
      font-size: 1rem;
      z-index: 100;
      line-height: 1.35;
    }

    .nav-bottom-right {
      position: fixed;
      bottom: 24px;
      right: 24px;
      font-size: 1rem;
      z-index: 100;
      line-height: 1.35;
      text-align: right;
    }

    /* --- HERO: full viewport, sphere sits in the lower portion --- */

    .hero-section {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12vh;
    }

    /* --- 3D IMAGE SPHERE --- */

    .sphere-container {
      position: relative;
      width: 60vh;
      height: 60vh;
      max-width: 90vw;
      flex-shrink: 0;
      cursor: grab;
    }

    .sphere-container:active {
      cursor: grabbing;
    }

    .sphere-item {
      position: absolute;
      top: 50%;
      left: 50%;
      will-change: transform, opacity;
      cursor: pointer;
    }

    .sphere-item img {
      display: block;
      object-fit: cover;
      transition: transform 0.25s ease;
      pointer-events: none;
    }

    .sphere-item:hover img {
      transform: scale(1.3);
    }

    /* --- BIO SECTION: below the fold --- */

    .bio-section {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 80px 20px 160px;
    }

    .bio-text {
      width: 70%;
      max-width: 70vw;
      text-align: center;
      font-size: 1.8rem;
      line-height: 1.4;
    }

    /* --- RESPONSIVE --- */

    @media (max-width: 600px) {
      .bio-text {
        font-size: 1.3rem;
        width: 90%;
        max-width: 90vw;
      }
      .sphere-container {
        width: 80vw;
        height: 80vw;
        max-height: 55vh;
      }
      .hero-section {
        padding-bottom: 8vh;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky: title top center -->
  <a href="#" class="nav-title" onclick="window.scrollTo({top:0,behavior:'smooth'}); return false;">Marine Zorea</a>

  <!-- Sticky: bottom left link -->
  <a href="#" class="nav-bottom-left">Works</a>

  <!-- Sticky: bottom right link -->
  <a href="#" class="nav-bottom-right">About</a>

  <!-- First viewport: sphere -->
  <div class="hero-section">
    <div class="sphere-container" id="sphere"></div>
  </div>

  <!-- Below the fold: bio -->
  <div class="bio-section">
    <p class="bio-text">
      Marine Zorea is a designer and researcher exploring the emergent and critical realities of everyday technology through objects, sounds, images, and scholarly writing.
    </p>
  </div>

  <script>
  (function () {
    var ITEM_COUNT = 20;
    var PERSPECTIVE = 900;
    var LERP = 0.08;
    var AUTO_SPEED = 0.0004;          /* very slow idle spin */

    var container = document.getElementById('sphere');
    var cachedRadius = 0;

    /* 20 images — alternating square (1:1) and wide (5:3),
       sizes now 45–75 px for better visibility */
    var imageData = [
      { src: 'https://marinezo.com/img/project_livingsounds/4.JPG',              ratio: 'square', w: 65 },
      { src: 'https://marinezo.com/img/home/thumb_audible.gif',                  ratio: 'wide',   w: 55 },
      { src: 'https://marinezo.com/img/project_allisheard/1.png',                ratio: 'square', w: 50 },
      { src: 'https://marinezo.com/img/project_anatomo/4.gif',                   ratio: 'wide',   w: 70 },
      { src: 'https://marinezo.com/img/project_chanelspaces/3.jpg',              ratio: 'square', w: 45 },
      { src: 'https://marinezo.com/img/home/thumb_CHANEL3.png',                  ratio: 'wide',   w: 60 },
      { src: 'https://marinezo.com/img/project_speakingofcollectivedining/1.gif',ratio: 'square', w: 55 },
      { src: 'https://marinezo.com/img/project_wavesbeyond/7.jpeg',              ratio: 'wide',   w: 65 },
      { src: 'https://marinezo.com/img/project_formsofquery/1.png',              ratio: 'square', w: 75 },
      { src: 'https://marinezo.com/img/project_thoughtfulobject/6.gif',          ratio: 'wide',   w: 50 },
      { src: 'https://marinezo.com/img/project_wavesbeyond/1.jpg',              ratio: 'square', w: 60 },
      { src: 'https://marinezo.com/img/project_livingsounds/4.JPG',              ratio: 'wide',   w: 48 },
      { src: 'https://marinezo.com/img/home/thumb_audible.gif',                  ratio: 'square', w: 55 },
      { src: 'https://marinezo.com/img/project_allisheard/1.png',                ratio: 'wide',   w: 65 },
      { src: 'https://marinezo.com/img/project_anatomo/4.gif',                   ratio: 'square', w: 45 },
      { src: 'https://marinezo.com/img/project_chanelspaces/3.jpg',              ratio: 'wide',   w: 70 },
      { src: 'https://marinezo.com/img/home/thumb_CHANEL3.png',                  ratio: 'square', w: 50 },
      { src: 'https://marinezo.com/img/project_speakingofcollectivedining/1.gif',ratio: 'wide',   w: 58 },
      { src: 'https://marinezo.com/img/project_wavesbeyond/7.jpeg',              ratio: 'square', w: 48 },
      { src: 'https://marinezo.com/img/project_formsofquery/1.png',              ratio: 'wide',   w: 55 }
    ];

    /* --- Build DOM elements --- */
    var items = imageData.map(function (data) {
      var el = document.createElement('div');
      el.className = 'sphere-item';

      var img = document.createElement('img');
      img.src = data.src;
      img.alt = '';
      img.draggable = false;

      var w = data.w;
      var h = data.ratio === 'square' ? w : Math.round(w * 3 / 5);

      img.style.width = w + 'px';
      img.style.height = h + 'px';

      el.style.marginLeft = (-w / 2) + 'px';
      el.style.marginTop  = (-h / 2) + 'px';

      el.appendChild(img);
      container.appendChild(el);

      return { el: el, w: w, h: h };
    });

    /* --- Fibonacci sphere distribution --- */
    var golden = (1 + Math.sqrt(5)) / 2;
    var points = [];

    for (var i = 0; i < ITEM_COUNT; i++) {
      var theta = Math.acos(1 - 2 * (i + 0.5) / ITEM_COUNT);
      var phi   = 2 * Math.PI * i / golden;

      points.push({
        ox: Math.sin(theta) * Math.cos(phi),
        oy: Math.cos(theta),
        oz: Math.sin(theta) * Math.sin(phi)
      });
    }

    /* --- Drag-based interaction (click + move) --- */
    var isDragging = false;
    var dragStartX = 0;
    var dragStartY = 0;
    var dragRotX = 0;
    var dragRotY = 0;
    var prevDragRotX = 0;
    var prevDragRotY = 0;
    var currentRotX = 0;
    var currentRotY = 0;
    var autoAngle = 0;

    container.addEventListener('mousedown', function (e) {
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      prevDragRotX = dragRotX;
      prevDragRotY = dragRotY;
      e.preventDefault();
    });

    document.addEventListener('mousemove', function (e) {
      if (!isDragging) return;
      var dx = e.clientX - dragStartX;
      var dy = e.clientY - dragStartY;
      dragRotY = prevDragRotY + dx * 0.006;
      dragRotX = prevDragRotX + dy * 0.006;
    });

    document.addEventListener('mouseup', function () {
      isDragging = false;
    });

    /* Touch support */
    container.addEventListener('touchstart', function (e) {
      if (e.touches.length === 1) {
        isDragging = true;
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        prevDragRotX = dragRotX;
        prevDragRotY = dragRotY;
      }
    }, { passive: true });

    document.addEventListener('touchmove', function (e) {
      if (!isDragging || e.touches.length !== 1) return;
      var dx = e.touches[0].clientX - dragStartX;
      var dy = e.touches[0].clientY - dragStartY;
      dragRotY = prevDragRotY + dx * 0.006;
      dragRotX = prevDragRotX + dy * 0.006;
    }, { passive: true });

    document.addEventListener('touchend', function () {
      isDragging = false;
    });

    /* --- Cache radius, recalculate on resize --- */
    function updateRadius() {
      var rect = container.getBoundingClientRect();
      cachedRadius = Math.min(rect.width, rect.height) / 2;
    }
    updateRadius();
    window.addEventListener('resize', updateRadius);

    /* --- Animation loop --- */
    function animate() {
      /* Steady, very slow auto-rotation */
      autoAngle += AUTO_SPEED;

      /* Smooth lerp toward drag target */
      currentRotX += (dragRotX - currentRotX) * LERP;
      currentRotY += (dragRotY - currentRotY) * LERP;

      var rotY = currentRotY + autoAngle;
      var rotX = currentRotX;

      var sinA = Math.sin(rotY);
      var cosA = Math.cos(rotY);
      var sinB = Math.sin(rotX);
      var cosB = Math.cos(rotX);

      var r = cachedRadius;

      for (var i = 0; i < ITEM_COUNT; i++) {
        var p = points[i];

        /* Rotate around Y */
        var x1 =  cosA * p.ox + sinA * p.oz;
        var y1 =  p.oy;
        var z1 = -sinA * p.ox + cosA * p.oz;

        /* Rotate around X */
        var x2 = x1;
        var y2 = cosB * y1 - sinB * z1;
        var z2 = sinB * y1 + cosB * z1;

        /* Perspective projection */
        var zWorld = z2 * r;
        var scale  = PERSPECTIVE / (PERSPECTIVE + zWorld);

        var sx = x2 * r * scale;
        var sy = y2 * r * scale;

        var item = items[i];
        item.el.style.transform = 'translate(' + sx + 'px,' + sy + 'px) scale(' + scale + ')';
        item.el.style.zIndex    = Math.round(scale * 1000);
        item.el.style.opacity   = Math.max(0.15, 0.2 + 0.8 * ((scale - 0.55) / 0.9));
      }

      requestAnimationFrame(animate);
    }

    animate();
  })();
  </script>

</body>
</html>
