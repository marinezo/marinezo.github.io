<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Axis Diagram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.22);
      font-family: Arial, sans-serif;
      font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="hint">drag to rotate · scroll to zoom · click axis to show label</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
// ─── Scene ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(5, 4, 7);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ─── Axes (positive direction only, white cylinders) ─────────────────────────
const AXIS_LEN  = 3;
const THIN_R    = 0.013;   // normal radius  → ~2px visual
const THICK_R   = 0.022;   // selected radius → ~3px visual
const THICK_SCL = THICK_R / THIN_R;

function buildAxisCylinder(dir) {
  const geo = new THREE.CylinderGeometry(THIN_R, THIN_R, AXIS_LEN, 8);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const mesh = new THREE.Mesh(geo, mat);
  // CylinderGeometry is along local Y; offset so it starts at origin
  if (dir === 'x') { mesh.rotation.z = -Math.PI / 2; mesh.position.x = AXIS_LEN / 2; }
  if (dir === 'y') {                                   mesh.position.y = AXIS_LEN / 2; }
  if (dir === 'z') { mesh.rotation.x =  Math.PI / 2; mesh.position.z = AXIS_LEN / 2; }
  mesh.userData.dir = dir;
  return mesh;
}

// Invisible hit-detection cylinder (wider = easier to click)
function buildAxisHit(dir) {
  const geo = new THREE.CylinderGeometry(0.12, 0.12, AXIS_LEN, 8);
  const mat = new THREE.MeshBasicMaterial({ visible: false });
  const mesh = new THREE.Mesh(geo, mat);
  if (dir === 'x') { mesh.rotation.z = -Math.PI / 2; mesh.position.x = AXIS_LEN / 2; }
  if (dir === 'y') {                                   mesh.position.y = AXIS_LEN / 2; }
  if (dir === 'z') { mesh.rotation.x =  Math.PI / 2; mesh.position.z = AXIS_LEN / 2; }
  mesh.userData.dir = dir;
  return mesh;
}

const axisDirs   = ['x', 'y', 'z'];
const axisCyls   = {};
const axisHits   = [];

axisDirs.forEach(dir => {
  const cyl = buildAxisCylinder(dir);
  scene.add(cyl);
  axisCyls[dir] = cyl;

  const hit = buildAxisHit(dir);
  scene.add(hit);
  axisHits.push(hit);
});

// ─── Label sprite helper (~1rem visual size) ──────────────────────────────────
function makeLabel(text, visible = true) {
  const W = 320, H = 48;
  const cvs = document.createElement('canvas');
  cvs.width = W; cvs.height = H;
  const ctx = cvs.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.font = '28px Arial';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 4, H / 2);
  const tex = new THREE.CanvasTexture(cvs);
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
  const spr = new THREE.Sprite(mat);
  const S = 0.18;  // world-unit height → roughly 1rem on screen
  spr.scale.set(S * W / H, S, 1);
  spr.visible = visible;
  return spr;
}

// ─── Axis end-labels (hidden until axis is clicked) ──────────────────────────
// Each axis gets 2 labels: one near origin (e.g. "X 0"), one at positive tip.
const axisLabelData = {
  x: [
    { pos: [0.18, 0.18, 0],          text: 'X start' },
    { pos: [AXIS_LEN + 0.2, 0.18, 0], text: 'X end'   },
  ],
  y: [
    { pos: [0.18, 0.18, 0],          text: 'Y start' },
    { pos: [0.18, AXIS_LEN + 0.2, 0], text: 'Y end'   },
  ],
  z: [
    { pos: [0, 0.18, 0.18],          text: 'Z start' },
    { pos: [0, 0.18, AXIS_LEN + 0.2], text: 'Z end'   },
  ],
};

const axisLabels = {};  // dir → [sprite, sprite]

axisDirs.forEach(dir => {
  axisLabels[dir] = axisLabelData[dir].map(({ pos, text }) => {
    const spr = makeLabel(text, false);
    spr.position.set(...pos);
    scene.add(spr);
    return spr;
  });
});

// ─── Points (on axes, black fill + white outline) ─────────────────────────────
const POINT_R     = 0.09;
const POINT_R_HOV = 0.14;

const pointData = [
  // X axis
  { pos: [0.6, 0, 0], name: 'Point 1'  },
  { pos: [1.2, 0, 0], name: 'Point 2'  },
  { pos: [1.9, 0, 0], name: 'Point 3'  },
  { pos: [2.6, 0, 0], name: 'Point 4'  },
  // Y axis
  { pos: [0, 0.7, 0], name: 'Point 5'  },
  { pos: [0, 1.4, 0], name: 'Point 6'  },
  { pos: [0, 2.2, 0], name: 'Point 7'  },
  // Z axis
  { pos: [0, 0, 0.8], name: 'Point 8'  },
  { pos: [0, 0, 1.6], name: 'Point 9'  },
  { pos: [0, 0, 2.4], name: 'Point 10' },
];

const pointGroups = [];   // for raycasting against children
const pointHitTargets = []; // flat list of inner meshes → look up parent group

pointData.forEach(({ pos, name }) => {
  const group = new THREE.Group();
  group.position.set(...pos);
  group.userData = { name, hovered: false };

  // Black fill
  const inner = new THREE.Mesh(
    new THREE.SphereGeometry(POINT_R, 20, 20),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
  );
  group.add(inner);

  // White outline via backface-enlarged shell
  const outer = new THREE.Mesh(
    new THREE.SphereGeometry(POINT_R * 1.38, 20, 20),
    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide })
  );
  group.add(outer);

  scene.add(group);
  pointGroups.push(group);
  pointHitTargets.push(inner);  // raycast hits inner sphere

  // Label
  const lbl = makeLabel(name, true);
  lbl.position.set(pos[0] + 0.18, pos[1] + 0.16, pos[2]);
  scene.add(lbl);
});

// ─── Orbit controls ───────────────────────────────────────────────────────────
let isDragging = false;
let dragMoved  = false;
let prevMouse  = { x: 0, y: 0 };

const spherical = {
  theta: Math.atan2(camera.position.x, camera.position.z),
  phi:   Math.acos(camera.position.y / camera.position.length()),
  r:     camera.position.length(),
};

function updateCamera() {
  const sp = Math.sin(spherical.phi);
  camera.position.set(
    spherical.r * sp * Math.sin(spherical.theta),
    spherical.r * Math.cos(spherical.phi),
    spherical.r * sp * Math.cos(spherical.theta)
  );
  camera.lookAt(0, 0, 0);
}

renderer.domElement.addEventListener('mousedown', e => {
  isDragging = true;
  dragMoved  = false;
  prevMouse  = { x: e.clientX, y: e.clientY };
  document.body.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', e => {
  if (!isDragging) { handleHover(e); return; }
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  if (Math.abs(dx) > 1 || Math.abs(dy) > 1) dragMoved = true;
  spherical.theta -= dx * 0.005;
  // Inverted phi: drag up → scene goes up (camera moves up)
  spherical.phi = Math.max(0.05, Math.min(Math.PI - 0.05, spherical.phi - dy * 0.005));
  prevMouse = { x: e.clientX, y: e.clientY };
  updateCamera();
});

window.addEventListener('mouseup', e => {
  if (!dragMoved) handleClick(e);
  isDragging = false;
  document.body.style.cursor = 'grab';
});

renderer.domElement.addEventListener('wheel', e => {
  spherical.r = Math.max(2, Math.min(20, spherical.r + e.deltaY * 0.01));
  updateCamera();
  e.preventDefault();
}, { passive: false });

// Touch
let lastPinchDist = null;
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true; dragMoved = false;
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else if (e.touches.length === 2) {
    isDragging = false;
    lastPinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
  e.preventDefault();
}, { passive: false });

renderer.domElement.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - prevMouse.x;
    const dy = e.touches[0].clientY - prevMouse.y;
    dragMoved = true;
    spherical.theta -= dx * 0.005;
    spherical.phi = Math.max(0.05, Math.min(Math.PI - 0.05, spherical.phi - dy * 0.005));
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    updateCamera();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (lastPinchDist) {
      spherical.r = Math.max(2, Math.min(20, spherical.r - (dist - lastPinchDist) * 0.02));
      updateCamera();
    }
    lastPinchDist = dist;
  }
  e.preventDefault();
}, { passive: false });

renderer.domElement.addEventListener('touchend', () => {
  isDragging = false; lastPinchDist = null;
});

// ─── Raycasting ───────────────────────────────────────────────────────────────
const raycaster  = new THREE.Raycaster();
const mouse2d    = new THREE.Vector2();
let selectedAxis = null;

function setMouse(e) {
  mouse2d.set(
     (e.clientX / innerWidth)  * 2 - 1,
    -(e.clientY / innerHeight) * 2 + 1
  );
}

function handleClick(e) {
  setMouse(e);
  raycaster.setFromCamera(mouse2d, camera);
  const hits = raycaster.intersectObjects(axisHits);

  if (!hits.length) return;

  const dir = hits[0].object.userData.dir;

  if (selectedAxis === dir) {
    // Deselect
    selectedAxis = null;
    axisDirs.forEach(d => {
      axisCyls[d].scale.set(1, 1, 1);
      axisLabels[d].forEach(s => s.visible = false);
    });
  } else {
    // Select new axis
    if (selectedAxis) {
      axisCyls[selectedAxis].scale.set(1, 1, 1);
      axisLabels[selectedAxis].forEach(s => s.visible = false);
    }
    selectedAxis = dir;
    axisCyls[dir].scale.set(THICK_SCL, 1, THICK_SCL);
    axisLabels[dir].forEach(s => s.visible = true);
  }
}

function handleHover(e) {
  setMouse(e);
  raycaster.setFromCamera(mouse2d, camera);
  const hits = raycaster.intersectObjects(pointHitTargets);

  pointGroups.forEach(g => {
    const isHit = hits.length > 0 && g.children.includes(hits[0].object);
    if (isHit && !g.userData.hovered) {
      g.userData.hovered = true;
      g.scale.setScalar(POINT_R_HOV / POINT_R);
    } else if (!isHit && g.userData.hovered) {
      g.userData.hovered = false;
      g.scale.setScalar(1);
    }
  });

  document.body.style.cursor = hits.length ? 'pointer' : 'grab';
}

document.body.style.cursor = 'grab';

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── Render loop ──────────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
