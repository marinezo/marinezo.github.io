<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Axis Diagram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
    #hint {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.18); font: 11px Arial; pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="hint">drag to rotate · scroll to zoom · click axis for labels</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
// ─── Scene ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(5, 4, 7);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ─── Axes ─────────────────────────────────────────────────────────────────────
const AXIS_LEN  = 3;
// Cylinder radii tuned so axis visually reads as ~2px / ~4px on screen
const THIN_R    = 0.010;   // default  (~2px)
const THICK_R   = 0.020;   // hover / press  (~4px)
const THICK_SCL = THICK_R / THIN_R;

function buildAxisCyl(dir) {
  const geo = new THREE.CylinderGeometry(THIN_R, THIN_R, AXIS_LEN, 8);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const m   = new THREE.Mesh(geo, mat);
  if (dir === 'x') { m.rotation.z = -Math.PI / 2; m.position.x = AXIS_LEN / 2; }
  if (dir === 'y') {                                m.position.y = AXIS_LEN / 2; }
  if (dir === 'z') { m.rotation.x =  Math.PI / 2; m.position.z = AXIS_LEN / 2; }
  m.userData.dir = dir;
  return m;
}

function buildAxisHit(dir) {  // wide invisible cylinder for easier clicking/hovering
  const geo = new THREE.CylinderGeometry(0.13, 0.13, AXIS_LEN, 8);
  const mat = new THREE.MeshBasicMaterial({ visible: false });
  const m   = new THREE.Mesh(geo, mat);
  if (dir === 'x') { m.rotation.z = -Math.PI / 2; m.position.x = AXIS_LEN / 2; }
  if (dir === 'y') {                                m.position.y = AXIS_LEN / 2; }
  if (dir === 'z') { m.rotation.x =  Math.PI / 2; m.position.z = AXIS_LEN / 2; }
  m.userData.dir = dir;
  return m;
}

const axisDirs = ['x', 'y', 'z'];
const axisCyls = {};
const axisHits = [];
let hoveredAxis = null;
let selectedAxis = null;

axisDirs.forEach(dir => {
  const cyl = buildAxisCyl(dir);
  scene.add(cyl);
  axisCyls[dir] = cyl;
  const hit = buildAxisHit(dir);
  scene.add(hit);
  axisHits.push(hit);
});

function refreshAxisScale() {
  axisDirs.forEach(dir => {
    const big = hoveredAxis === dir || selectedAxis === dir;
    axisCyls[dir].scale.set(big ? THICK_SCL : 1, 1, big ? THICK_SCL : 1);
  });
}

// ─── Sprite label helper ──────────────────────────────────────────────────────
// S = world-unit height of sprite.  At default cam distance (~8.6wu), FOV50,
// screen shows ~8wu tall → 1ru (16px@800p) ≈ S=0.16.  1.5rem ≈ S=0.24.
function makeSprite(text, S = 0.18, visible = false) {
  const W = 400, H = 72;
  const cvs = document.createElement('canvas');
  cvs.width = W; cvs.height = H;
  const ctx = cvs.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.font = '38px Arial';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 4, H / 2);
  const tex = new THREE.CanvasTexture(cvs);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  spr.scale.set(S * W / H, S, 1);
  spr.visible = visible;
  return spr;
}

// ─── Axis labels (hidden; appear on press, 1.5rem, ~10px beside axis) ─────────
// LABEL_OFF ≈ 10px in world units at default zoom
const LABEL_OFF = 0.13;

const axisLabelDefs = {
  x: [
    { pos: [0,        LABEL_OFF, 0], text: 'X start' },
    { pos: [AXIS_LEN, LABEL_OFF, 0], text: 'X end'   },
  ],
  y: [
    { pos: [LABEL_OFF, 0,        0], text: 'Y start' },
    { pos: [LABEL_OFF, AXIS_LEN, 0], text: 'Y end'   },
  ],
  z: [
    { pos: [0, LABEL_OFF, 0       ], text: 'Z start' },
    { pos: [0, LABEL_OFF, AXIS_LEN], text: 'Z end'   },
  ],
};

const axisLabels = {};
axisDirs.forEach(dir => {
  axisLabels[dir] = axisLabelDefs[dir].map(({ pos, text }) => {
    const spr = makeSprite(text, 0.24, false);  // 1.5rem
    spr.position.set(...pos);
    scene.add(spr);
    return spr;
  });
});

// ─── Points (3px dots scattered in 3D space) ──────────────────────────────────
const PT_PX     = 3;   // normal size in screen pixels
const PT_PX_HOV = 6;   // hover size

const pointData = [
  { pos: [1.2, 0.8, 1.5], name: 'Point 1' },
  { pos: [0.5, 1.8, 0.7], name: 'Point 2' },
  { pos: [2.1, 1.2, 0.4], name: 'Point 3' },
  { pos: [0.8, 0.5, 2.2], name: 'Point 4' },
  { pos: [1.7, 2.0, 1.0], name: 'Point 5' },
  { pos: [2.5, 0.6, 1.8], name: 'Point 6' },
  { pos: [0.4, 1.4, 0.9], name: 'Point 7' },
  { pos: [1.5, 2.5, 0.3], name: 'Point 8' },
];

function makeDash(from, to) {
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(...from), new THREE.Vector3(...to),
  ]);
  const mat = new THREE.LineDashedMaterial({
    color: 0xffffff, linewidth: 1, dashSize: 0.09, gapSize: 0.07,
  });
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  line.visible = false;
  return line;
}

const pointObjects = [];  // { dot, hitSphere, label, dashes[] }
const hitSpheres   = [];

pointData.forEach(({ pos: [px, py, pz], name }, idx) => {
  // Visual dot (screen-pixel size, not attenuated by distance)
  const dotGeo = new THREE.BufferGeometry();
  dotGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0], 3));
  const dotMat = new THREE.PointsMaterial({ color: 0xffffff, size: PT_PX, sizeAttenuation: false });
  const dot = new THREE.Points(dotGeo, dotMat);
  dot.position.set(px, py, pz);
  scene.add(dot);

  // Invisible sphere for comfortable raycasting (no need to pixel-hunt a 3px dot)
  const hitGeo = new THREE.SphereGeometry(0.12, 8, 8);
  const hitMat = new THREE.MeshBasicMaterial({ visible: false });
  const hit = new THREE.Mesh(hitGeo, hitMat);
  hit.position.set(px, py, pz);
  hit.userData.idx = idx;
  scene.add(hit);
  hitSpheres.push(hit);

  // Label (hidden until hover) ~1rem
  const label = makeSprite(name, 0.18, false);
  label.position.set(px + 0.18, py + 0.14, pz);
  scene.add(label);

  // Dashed coordinate lines to each axis
  const dashes = [
    makeDash([px, py, pz], [px, 0,  0 ]),  // → X axis
    makeDash([px, py, pz], [0,  py, 0 ]),  // → Y axis
    makeDash([px, py, pz], [0,  0,  pz]),  // → Z axis
  ];
  dashes.forEach(d => scene.add(d));

  pointObjects.push({ dot, hitSphere: hit, label, dashes, hovered: false });
});

// ─── Orbit ────────────────────────────────────────────────────────────────────
let isDragging = false;
let dragMoved  = false;
let prevMouse  = { x: 0, y: 0 };

const sph = {
  theta: Math.atan2(camera.position.x, camera.position.z),
  phi:   Math.acos(camera.position.y / camera.position.length()),
  r:     camera.position.length(),
};

function updateCamera() {
  const sp = Math.sin(sph.phi);
  camera.position.set(
    sph.r * sp * Math.sin(sph.theta),
    sph.r * Math.cos(sph.phi),
    sph.r * sp * Math.cos(sph.theta)
  );
  camera.lookAt(0, 0, 0);
}

renderer.domElement.addEventListener('mousedown', e => {
  isDragging = true; dragMoved = false;
  prevMouse = { x: e.clientX, y: e.clientY };
  document.body.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (!isDragging) { handleHover(e); return; }
  const dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
  if (Math.abs(dx) > 1 || Math.abs(dy) > 1) dragMoved = true;
  sph.theta -= dx * 0.005;
  sph.phi = Math.max(0.05, Math.min(Math.PI - 0.05, sph.phi - dy * 0.005)); // inverted: up=up
  prevMouse = { x: e.clientX, y: e.clientY };
  updateCamera();
});
window.addEventListener('mouseup', e => {
  if (!dragMoved) handleClick(e);
  isDragging = false;
  document.body.style.cursor = 'grab';
});
renderer.domElement.addEventListener('wheel', e => {
  sph.r = Math.max(2, Math.min(20, sph.r + e.deltaY * 0.01));
  updateCamera();
  e.preventDefault();
}, { passive: false });

// Touch
let lastPinch = null;
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true; dragMoved = false;
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else if (e.touches.length === 2) {
    isDragging = false;
    lastPinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
  }
  e.preventDefault();
}, { passive: false });
renderer.domElement.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - prevMouse.x, dy = e.touches[0].clientY - prevMouse.y;
    dragMoved = true;
    sph.theta -= dx * 0.005;
    sph.phi = Math.max(0.05, Math.min(Math.PI - 0.05, sph.phi - dy * 0.005));
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    updateCamera();
  } else if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    if (lastPinch) { sph.r = Math.max(2, Math.min(20, sph.r - (d - lastPinch) * 0.02)); updateCamera(); }
    lastPinch = d;
  }
  e.preventDefault();
}, { passive: false });
renderer.domElement.addEventListener('touchend', () => { isDragging = false; lastPinch = null; });

// ─── Raycasting ───────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse2d   = new THREE.Vector2();

function setMouse(e) {
  mouse2d.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
}

function handleClick(e) {
  setMouse(e);
  raycaster.setFromCamera(mouse2d, camera);
  const hits = raycaster.intersectObjects(axisHits);
  if (!hits.length) return;
  const dir = hits[0].object.userData.dir;
  // Deselect old labels
  if (selectedAxis) axisLabels[selectedAxis].forEach(s => s.visible = false);
  selectedAxis = selectedAxis === dir ? null : dir;
  if (selectedAxis) axisLabels[selectedAxis].forEach(s => s.visible = true);
  refreshAxisScale();
}

function handleHover(e) {
  setMouse(e);
  raycaster.setFromCamera(mouse2d, camera);

  // Points
  const ptHits  = raycaster.intersectObjects(hitSpheres);
  const hovPtIdx = ptHits.length > 0 ? ptHits[0].object.userData.idx : -1;

  pointObjects.forEach((obj, i) => {
    const h = i === hovPtIdx;
    if (h === obj.hovered) return;
    obj.hovered = h;
    obj.dot.material.size = h ? PT_PX_HOV : PT_PX;
    obj.label.visible = h;
    obj.dashes.forEach(d => d.visible = h);
  });

  // Axes
  const axHits = raycaster.intersectObjects(axisHits);
  const prevH  = hoveredAxis;
  hoveredAxis  = axHits.length > 0 ? axHits[0].object.userData.dir : null;
  if (hoveredAxis !== prevH) refreshAxisScale();

  document.body.style.cursor = (ptHits.length || axHits.length) ? 'pointer' : 'grab';
}

document.body.style.cursor = 'grab';

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); })();
</script>
</body>
</html>
